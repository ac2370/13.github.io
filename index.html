    <!-- ===== 锁屏样式 ===== -->
    <style>
        /* ===== 锁屏全局重置 ===== */
        .lock-screen * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 锁屏容器 ===== */
        .lock-screen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            width: 100%;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: #1e1e2f;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 20px 16px 18px;
            overflow-y: auto;
            scrollbar-width: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .lock-screen::-webkit-scrollbar { display: none; }

        /* ===== 锁屏背景层 ===== */
        .lock-screen .bg-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: #1e1e2f;
            transition: background 0.6s ease;
            pointer-events: none;
        }
        .lock-screen .bg-layer.has-image {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ===== 锁屏内容（置于背景之上） ===== */
        .lock-screen .lock-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: flex-start;
            padding-top: 8px;
        }

        /* ===== 状态栏 - 改为居中文字 ===== */
        .lock-screen .status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 2px;
            padding: 0 4px 14px;
            flex-shrink: 0;
            font-style: italic;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* ===== 所有卡片半透明毛玻璃 ===== */
        .lock-screen .user-profile-card,
        .lock-screen .core-interaction,
        .lock-screen .play-follow-row,
        .lock-screen .post-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        /* ===== 用户卡片 ===== */
        .lock-screen .user-profile-card {
            padding: 12px 14px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .lock-screen .profile-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .lock-screen .avatar-large {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
            user-select: none;
            overflow: hidden;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .lock-screen .avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .lock-screen .avatar-large .upload-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 20px;
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 50%;
            pointer-events: none;
        }
        .lock-screen .avatar-large:hover .upload-hint { opacity: 1; }
        .lock-screen .profile-name-area {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 0;
        }
        .lock-screen .profile-name {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: transparent;
            border: none;
            padding: 0;
            font-family: inherit;
            width: 100%;
            outline: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
            transition: border-color 0.3s;
        }
        .lock-screen .profile-name:focus { border-bottom-color: rgba(255, 255, 255, 0.5); }
        .lock-screen .profile-location {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
        }
        .lock-screen .profile-location i { font-style: normal; }
        .lock-screen .profile-location input {
            background: transparent;
            border: none;
            padding: 0;
            font-family: inherit;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            outline: none;
            width: 50px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s;
        }
        .lock-screen .profile-location input:focus {
            border-bottom-color: rgba(255, 255, 255, 0.3);
            color: #fff;
        }
        .lock-screen .profile-right {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            padding-left: 4px;
        }
        .lock-screen .stat-item { text-align: center; }
        .lock-screen .stat-number {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: transparent;
            border: none;
            padding: 0;
            width: 30px;
            text-align: center;
            font-family: inherit;
            outline: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
            transition: border-color 0.3s;
        }
        .lock-screen .stat-number:focus { border-bottom-color: rgba(255, 255, 255, 0.4); }
        .lock-screen .stat-label {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.5px;
            margin-top: 1px;
        }

        /* ===== 核心互动 & 纪念日 ===== */
        .lock-screen .core-interaction {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .lock-screen .interaction-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            flex: 1;
        }
        .lock-screen .time-bubble {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 4px 12px 4px 10px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.25s;
            user-select: none;
            border: none;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(4px);
        }
        .lock-screen .time-bubble:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.02);
        }
        .lock-screen .time-bubble .badge-icon { font-size: 11px; }
        .lock-screen .time-bubble .edit-hint { font-size: 7px; opacity: 0.5; }
        .lock-screen .avatar-stack { display: flex; align-items: center; }
        .lock-screen .avatar-stack .mini-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-right: -6px;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 6px;
            user-select: none;
            overflow: hidden;
            position: relative;
        }
        .lock-screen .avatar-stack .mini-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .lock-screen .avatar-stack .mini-avatar:last-child { margin-right: 0; }
        .lock-screen .time-display {
            display: flex;
            align-items: baseline;
            gap: 2px;
        }
        .lock-screen .time-number {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            line-height: 1;
            min-width: 22px;
            text-align: center;
        }
        .lock-screen .time-unit {
            font-size: 11px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            margin-left: 2px;
        }
        .lock-screen .anniversary-label {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 1px;
            font-weight: 400;
            cursor: pointer;
            transition: color 0.3s;
        }
        .lock-screen .anniversary-label:hover { color: rgba(255, 255, 255, 0.6); }
        .lock-screen .interaction-right {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }
        .lock-screen .photo-stack {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: flex-end;
        }
        .lock-screen .photo-card {
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transform: rotate(var(--rot, 0deg));
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 7px;
            user-select: none;
            overflow: hidden;
            position: relative;
        }
        .lock-screen .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .lock-screen .photo-card .upload-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .lock-screen .photo-card:hover .upload-hint { opacity: 1; }
        .lock-screen .photo-card:first-child { --rot: 5deg; }
        .lock-screen .photo-card:last-child { --rot: -3deg; margin-top: -4px; }

        /* ===== 播放/跟随行 ===== */
        .lock-screen .play-follow-row {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .lock-screen .play-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .lock-screen .play-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 7px;
            user-select: none;
            overflow: hidden;
            position: relative;
        }
        .lock-screen .play-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .lock-screen .play-avatar .upload-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 50%;
            pointer-events: none;
        }
        .lock-screen .play-avatar:hover .upload-hint { opacity: 1; }
        .lock-screen .play-info {
            display: flex;
            flex-direction: column;
            gap: 0px;
            min-width: 0;
        }
        .lock-screen .play-title {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            background: transparent;
            border: none;
            padding: 0;
            font-family: inherit;
            outline: none;
            width: 100%;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s;
        }
        .lock-screen .play-title:focus { border-bottom-color: rgba(255, 255, 255, 0.3); }
        .lock-screen .play-sub {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            background: transparent;
            border: none;
            padding: 0;
            font-family: inherit;
            outline: none;
            width: 100%;
            border-bottom: 1px dashed transparent;
            transition: border-color 0.3s;
        }
        .lock-screen .play-sub:focus {
            border-bottom-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.7);
        }
        .lock-screen .play-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 13px;
            backdrop-filter: blur(4px);
        }
        .lock-screen .play-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        /* ===== 动态卡片 ===== */
        .lock-screen .post-card {
            padding: 12px 14px 12px;
        }
        .lock-screen .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .lock-screen .post-user {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lock-screen .post-avatar-small {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 6px;
            user-select: none;
            overflow: hidden;
            position: relative;
        }
        .lock-screen .post-avatar-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .lock-screen .post-avatar-small .upload-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 50%;
            pointer-events: none;
        }
        .lock-screen .post-avatar-small:hover .upload-hint { opacity: 1; }
        .lock-screen .post-user-info {
            display: flex;
            flex-direction: column;
            gap: 0px;
        }
        .lock-screen .post-username {
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            background: transparent;
            border: none;
            padding: 0;
            font-family: inherit;
            outline: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s;
        }
        .lock-screen .post-username:focus { border-bottom-color: rgba(255, 255, 255, 0.3); }
        .lock-screen .post-user-sub {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.4);
            background: transparent;
            border: none;
            padding: 0;
            font-family: inherit;
            outline: none;
            border-bottom: 1px dashed transparent;
            transition: border-color 0.3s;
        }
        .lock-screen .post-user-sub:focus {
            border-bottom-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
        }
        .lock-screen .post-more {
            display: flex;
            gap: 3px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 12px;
            transition: background 0.2s;
            border: none;
            background: transparent;
        }
        .lock-screen .post-more:hover { background: rgba(255, 255, 255, 0.06); }
        .lock-screen .post-more span {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            display: block;
        }
        .lock-screen .post-image-area {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 14px 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 70px;
            cursor: pointer;
            transition: background 0.3s;
            border: 2px dashed rgba(255, 255, 255, 0.05);
        }
        .lock-screen .post-image-area:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.1);
        }
        .lock-screen .post-image-area .area-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.15);
            font-size: 10px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .lock-screen .post-image-area:hover .area-hint { opacity: 1; }
        .lock-screen .post-image-center {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.15);
            font-size: 9px;
            user-select: none;
            position: relative;
            transition: transform 0.3s;
            overflow: hidden;
            flex-shrink: 0;
        }
        .lock-screen .post-image-center img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .lock-screen .post-image-center .upload-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 50%;
            pointer-events: none;
        }
        .lock-screen .post-image-center:hover .upload-hint { opacity: 1; }
        .lock-screen .post-image-center .heart-icon {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            color: #ff6b81;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 2;
        }
        .lock-screen .post-image-center .heart-icon:hover { transform: scale(1.15); }
        .lock-screen .post-footer {
            display: flex;
            justify-content: space-between;
            padding-top: 2px;
        }
        .lock-screen .post-footer-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .lock-screen .post-footer-right {
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: right;
        }
        .lock-screen .post-tag {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            background: transparent;
            border: none;
            padding: 0;
            font-family: inherit;
            outline: none;
            width: 50px;
            border-bottom: 1px dashed transparent;
            transition: border-color 0.3s;
        }
        .lock-screen .post-tag:focus {
            border-bottom-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.7);
        }
        .lock-screen .post-title {
            font-size: 10px;
            font-weight: 600;
            color: #fff;
            background: transparent;
            border: none;
            padding: 0;
            font-family: inherit;
            outline: none;
            width: 50px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s;
        }
        .lock-screen .post-title:focus { border-bottom-color: rgba(255, 255, 255, 0.3); }

        /* ===== 画廊 - 4张，居中，间距均匀，纵向拉长 ===== */
        .lock-screen .gallery-scroll {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 8px 0 6px;
            flex-shrink: 0;
        }
        .lock-screen .gallery-item {
            flex: 0 0 70px;
            height: 90px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            transform: rotate(var(--g-rot, 0deg));
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s, opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.15);
            font-size: 8px;
            user-select: none;
            overflow: hidden;
            position: relative;
        }
        .lock-screen .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .lock-screen .gallery-item .upload-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .lock-screen .gallery-item:hover .upload-hint { opacity: 1; }
        .lock-screen .gallery-item:nth-child(1) { --g-rot: -2deg; }
        .lock-screen .gallery-item:nth-child(2) { --g-rot: 3deg; }
        .lock-screen .gallery-item:nth-child(3) { --g-rot: -3deg; }
        .lock-screen .gallery-item:nth-child(4) { --g-rot: 4deg; }

        /* ===== 底部控制区 ===== */
        .lock-screen .bottom-area {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            padding-top: 2px;
        }

        /* ===== 解锁按钮 ===== */
        .lock-screen .unlock-area {
            display: flex;
            justify-content: center;
            padding: 4px 0 2px;
        }
        .lock-screen .unlock-btn {
            width: 80%;
            max-width: 200px;
            padding: 12px 18px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            font-family: inherit;
        }
        .lock-screen .unlock-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .lock-screen .unlock-btn:active { transform: scale(0.96); }
        .lock-screen .unlock-btn .arrow {
            font-size: 18px;
            transition: transform 0.3s;
        }
        .lock-screen .unlock-btn:hover .arrow { transform: translateX(4px); }

        /* ===== 锁屏响应式 ===== */
        @media (max-width: 420px) {
            .lock-screen { padding: 14px 12px 12px; }
            .lock-screen .avatar-large { width: 38px; height: 38px; }
            .lock-screen .profile-name { font-size: 13px; }
            .lock-screen .stat-number { font-size: 13px; width: 26px; }
            .lock-screen .time-number { font-size: 18px; min-width: 20px; }
            .lock-screen .photo-card { width: 34px; height: 34px; }
            .lock-screen .gallery-item { flex: 0 0 58px; height: 76px; }
            .lock-screen .post-image-center { width: 46px; height: 46px; }
            .lock-screen .post-card { padding: 10px 10px 10px; }
            .lock-screen .unlock-btn { font-size: 13px; padding: 10px 14px; }
        }
        @media (max-width: 360px) {
            .lock-screen .profile-right { gap: 8px; }
            .lock-screen .stat-number { font-size: 12px; width: 22px; }
            .lock-screen .photo-card { width: 30px; height: 30px; }
            .lock-screen .gallery-item { flex: 0 0 50px; height: 66px; }
        }

        /* ===== 日期弹窗（锁屏用） ===== */
        .lock-date-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .lock-date-modal-overlay.active { display: flex; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .lock-date-modal-box {
            background: #1c1c24;
            border-radius: 28px;
            padding: 28px 24px 24px;
            width: 90%;
            max-width: 340px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .lock-date-modal-box .date-modal-title {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 4px;
        }
        .lock-date-modal-box .date-modal-sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            margin-bottom: 18px;
        }
        .lock-date-modal-box .date-modal-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            font-size: 16px;
            font-family: inherit;
            color: #fff;
            background: rgba(255, 255, 255, 0.04);
            outline: none;
            transition: border-color 0.3s;
        }
        .lock-date-modal-box .date-modal-input:focus { border-color: rgba(255, 255, 255, 0.2); }
        .lock-date-modal-box .date-modal-input::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            opacity: 0.6;
            padding: 4px;
            cursor: pointer;
        }
        .lock-date-modal-box .date-modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .lock-date-modal-box .date-modal-btns button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .lock-date-modal-box .date-modal-btns .btn-cancel {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
        }
        .lock-date-modal-box .date-modal-btns .btn-cancel:hover { background: rgba(255, 255, 255, 0.12); }
        .lock-date-modal-box .date-modal-btns .btn-confirm {
            background: #fff;
            color: #111;
        }
        .lock-date-modal-box .date-modal-btns .btn-confirm:hover {
            background: #eee;
            transform: scale(1.02);
        }

        /* ===== 隐藏输入 ===== */
        .lock-screen .hidden-input { display: none; }
        .lock-screen .bg-file-input { display: none; }

        /* ===== 返回图标（聊天页浮动） ===== */
        .back-float-btn {
            position: fixed;
            bottom: 100px;
            right: 20px;
            z-index: 9999;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            user-select: none;
            touch-action: none;
        }
        .back-float-btn:hover {
            transform: scale(1.05);
            background: rgba(0, 0, 0, 0.8);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .back-float-btn .fa-arrow-left {
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .back-float-btn.dragging {
            transition: none !important;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 215, 0, 0.8);
            transform: scale(1.08);
        }

        /* ===== 外观设置 - 锁屏背景 ===== */
        .bg-gallery-lock {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .bg-gallery-lock .bg-item {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            background: var(--primary-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--text-secondary);
        }
        .bg-gallery-lock .bg-item:hover { border-color: var(--accent-color); transform: scale(1.05); }
        .bg-gallery-lock .bg-item.active { border-color: var(--accent-color); box-shadow: 0 0 0 2px var(--accent-color); }
        .bg-gallery-lock .bg-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .bg-gallery-lock .bg-item .bg-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            font-size: 10px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .bg-gallery-lock .bg-item:hover .bg-remove { display: flex; }
        .bg-gallery-lock .bg-add-btn {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            border: 2px dashed var(--border-color);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 20px;
            transition: all 0.2s;
        }
        .bg-gallery-lock .bg-add-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
    </style>
</head>

<script>
    (function() {
        'use strict';

        // ============================================================
        //  图片压缩工具（锁屏所有图片上传时自动压缩至 200KB 以内）
        // ============================================================
        function compressImage(file, maxSizeKB, callback) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas');
                    var ctx = canvas.getContext('2d');
                    var width = img.width;
                    var height = img.height;
                    var maxDimension = 800;
                    if (width > maxDimension || height > maxDimension) {
                        if (width > height) {
                            height = height * maxDimension / width;
                            width = maxDimension;
                        } else {
                            width = width * maxDimension / height;
                            height = maxDimension;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    var quality = 0.9;
                    var dataUrl = canvas.toDataURL('image/jpeg', quality);
                    // 如果压缩后仍超过限制，逐步降低质量
                    while (dataUrl.length > maxSizeKB * 1024 && quality > 0.1) {
                        quality -= 0.05;
                        dataUrl = canvas.toDataURL('image/jpeg', quality);
                    }
                    callback(dataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ============================================================
        //  锁屏：状态栏时间（已删除，替换为固定文字）
        // ============================================================

        // ============================================================
        //  锁屏：纪念日逻辑
        // ============================================================
        var lockTimeNumber = document.getElementById('lockTimeNumber');
        var lockAnniversaryLabel = document.getElementById('lockAnniversaryLabel');
        var lockDateModal = document.getElementById('lockDateModal');
        var lockDatePicker = document.getElementById('lockDatePicker');
        var lockDateConfirm = document.getElementById('lockDateConfirm');
        var lockDateCancel = document.getElementById('lockDateCancel');
        var lockTimeBubble = document.getElementById('lockTimeBubble');

        var lockAnniversaryDate = null;
        try {
            var saved = localStorage.getItem('lock_anniversary_date');
            if (saved) {
                var d = new Date(saved);
                if (!isNaN(d.getTime())) { lockAnniversaryDate = d; lockUpdateDaysDisplay(); }
            }
        } catch (e) {}

        function lockUpdateDaysDisplay() {
            if (!lockAnniversaryDate) {
                if (lockTimeNumber) lockTimeNumber.textContent = '0';
                if (lockAnniversaryLabel) lockAnniversaryLabel.textContent = '未设置纪念日';
                return;
            }
            var now = new Date();
            var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            var start = new Date(lockAnniversaryDate.getFullYear(), lockAnniversaryDate.getMonth(), lockAnniversaryDate.getDate());
            var diff = Math.floor((today.getTime() - start.getTime()) / (1000 * 60 * 60 * 24));
            if (lockTimeNumber) lockTimeNumber.textContent = diff >= 0 ? diff : 0;
            var y = lockAnniversaryDate.getFullYear();
            var m = String(lockAnniversaryDate.getMonth() + 1).padStart(2, '0');
            var d = String(lockAnniversaryDate.getDate()).padStart(2, '0');
            if (lockAnniversaryLabel) lockAnniversaryLabel.textContent = '❤️ ' + y + '.' + m + '.' + d + ' 至今';
            try { localStorage.setItem('lock_anniversary_date', lockAnniversaryDate.toISOString()); } catch (e) {}
        }

        if (lockTimeBubble) {
            lockTimeBubble.addEventListener('click', function(e) {
                e.stopPropagation();
                if (lockAnniversaryDate) {
                    var y = lockAnniversaryDate.getFullYear();
                    var m = String(lockAnniversaryDate.getMonth() + 1).padStart(2, '0');
                    var d = String(lockAnniversaryDate.getDate()).padStart(2, '0');
                    lockDatePicker.value = y + '-' + m + '-' + d;
                } else {
                    var now = new Date();
                    lockDatePicker.value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
                }
                lockDateModal.classList.add('active');
            });
        }

        function lockCloseDateModal() { if (lockDateModal) lockDateModal.classList.remove('active'); }
        if (lockDateCancel) lockDateCancel.addEventListener('click', lockCloseDateModal);
        if (lockDateConfirm) {
            lockDateConfirm.addEventListener('click', function() {
                var val = lockDatePicker.value;
                if (!val) { alert('请选择日期'); return; }
                var parts = val.split('-');
                var d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                if (isNaN(d.getTime())) { alert('无效日期'); return; }
                lockAnniversaryDate = d;
                lockUpdateDaysDisplay();
                lockCloseDateModal();
                if (lockTimeBubble) {
                    lockTimeBubble.style.transform = 'scale(0.92)';
                    setTimeout(function() { lockTimeBubble.style.transform = ''; }, 150);
                }
            });
        }
        if (lockDateModal) {
            lockDateModal.addEventListener('click', function(e) { if (e.target === this) lockCloseDateModal(); });
        }
        if (lockAnniversaryLabel) {
            lockAnniversaryLabel.addEventListener('click', function() {
                if (lockAnniversaryDate && confirm('清除纪念日设置？')) {
                    lockAnniversaryDate = null;
                    try { localStorage.removeItem('lock_anniversary_date'); } catch (e) {}
                    lockUpdateDaysDisplay();
                }
            });
        }

        // ============================================================
        //  锁屏：图片/头像上传（带压缩）
        // ============================================================
        var lockFileInput = document.getElementById('lockFileInput');
        var lockCurrentTarget = null;

        function lockGetFileInput() { return document.getElementById('lockFileInput'); }

        document.querySelectorAll('#lockScreen [data-type="image"], #lockScreen [data-type="avatar"]').forEach(function(el) {
            el.addEventListener('click', function(e) {
                if (e.target.closest('.heart-icon')) return;
                e.stopPropagation();
                lockCurrentTarget = this;
                var fi = lockGetFileInput();
                if (fi) fi.click();
            });
        });

        var lockPostImageArea = document.getElementById('lockPostImageArea');
        if (lockPostImageArea) {
            lockPostImageArea.addEventListener('click', function(e) {
                if (e.target.closest('.post-image-center') || e.target.closest('.heart-icon')) return;
                lockCurrentTarget = document.getElementById('lockPostCenterImage');
                var fi = lockGetFileInput();
                if (fi) fi.click();
            });
        }

        var lockHeartIcon = document.getElementById('lockHeartIcon');
        if (lockHeartIcon) {
            lockHeartIcon.addEventListener('click', function(e) {
                e.stopPropagation();
                this.style.transform = 'scale(1.3)';
                this.style.color = '#ff6b81';
                setTimeout(function() {
                    lockHeartIcon.style.transform = '';
                    lockHeartIcon.style.color = '#ff6b81';
                }, 300);
                alert('❤️ 已收藏字卡 (演示)');
            });
        }

        if (lockFileInput) {
            lockFileInput.addEventListener('change', function() {
                var file = this.files[0];
                if (!file || !lockCurrentTarget) return;
                // 使用压缩
                compressImage(file, 200, function(compressedDataUrl) {
                    lockCurrentTarget.innerHTML = '';
                    var img = document.createElement('img');
                    img.src = compressedDataUrl;
                    img.alt = 'uploaded';
                    lockCurrentTarget.appendChild(img);
                    if (lockCurrentTarget.id === 'lockPostCenterImage') {
                        var heart = document.createElement('span');
                        heart.className = 'heart-icon';
                        heart.id = 'lockHeartIcon';
                        heart.textContent = '♥';
                        lockCurrentTarget.appendChild(heart);
                        heart.addEventListener('click', function(e) {
                            e.stopPropagation();
                            this.style.transform = 'scale(1.3)';
                            this.style.color = '#ff6b81';
                            setTimeout(function() {
                                heart.style.transform = '';
                                heart.style.color = '#ff6b81';
                            }, 300);
                            alert('❤️ 已收藏字卡');
                        });
                    }
                });
                this.value = '';
                lockCurrentTarget = null;
            });
        }

        // ============================================================
        //  锁屏：背景设置（带压缩）
        // ============================================================
        var lockBgLayer = document.getElementById('lockBgLayer');
        var lockBgFileInput = document.getElementById('lockBgFileInput');

        if (lockBgFileInput) {
            lockBgFileInput.addEventListener('change', function() {
                var file = this.files[0];
                if (!file) return;
                compressImage(file, 200, function(compressedDataUrl) {
                    if (lockBgLayer) {
                        lockBgLayer.style.backgroundImage = 'url(' + compressedDataUrl + ')';
                        lockBgLayer.style.backgroundSize = 'cover';
                        lockBgLayer.style.backgroundPosition = 'center';
                        lockBgLayer.classList.add('has-image');
                    }
                });
                this.value = '';
            });
        }

        // ============================================================
        //  锁屏：播放按钮
        // ============================================================
        var lockPlayBtn = document.getElementById('lockPlayBtn');
        var lockIsPlaying = false;
        if (lockPlayBtn) {
            lockPlayBtn.addEventListener('click', function() {
                lockIsPlaying = !lockIsPlaying;
                this.textContent = lockIsPlaying ? '⏸' : '▶';
                this.style.transform = 'scale(0.92)';
                setTimeout(function() { lockPlayBtn.style.transform = ''; }, 150);
            });
        }

        // ============================================================
        //  锁屏：更多按钮
        // ============================================================
        var lockPostMoreBtn = document.getElementById('lockPostMoreBtn');
        if (lockPostMoreBtn) {
            lockPostMoreBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                alert('📋 字卡更多菜单');
            });
        }

        // ============================================================
        //  锁屏：解锁 → 播放动画 → 进入聊天
        // ============================================================
        var lockUnlockBtn = document.getElementById('lockUnlockBtn');
        var lockScreenEl = document.getElementById('lockScreen');
        var welcomeEl = document.getElementById('welcome-animation');
        var headerEl = document.querySelector('.header');
        var chatAreaEl = document.querySelector('.main-chat-area');
        var inputAreaEl = document.querySelector('.input-area-wrapper');
        var immersiveBtn = document.getElementById('immersive-exit-btn');

        // 创建返回图标
        var backBtn = document.createElement('div');
        backBtn.className = 'back-float-btn';
        backBtn.innerHTML = '<i class="fas fa-arrow-left"></i>';
        backBtn.id = 'backFloatBtn';
        backBtn.style.display = 'none';
        document.body.appendChild(backBtn);

        // 返回图标拖动功能
        var isDragging = false;
        var dragOffsetX = 0, dragOffsetY = 0;
        var isDraggable = false;
        var doubleClickTimer = null;

        backBtn.addEventListener('dblclick', function(e) {
            e.preventDefault();
            if (doubleClickTimer) {
                clearTimeout(doubleClickTimer);
                doubleClickTimer = null;
            }
            isDraggable = !isDraggable;
            if (isDraggable) {
                backBtn.style.borderColor = 'rgba(255, 215, 0, 0.8)';
                backBtn.style.boxShadow = '0 0 20px rgba(255, 215, 0, 0.3)';
            } else {
                backBtn.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                backBtn.style.boxShadow = '0 4px 20px rgba(0, 0, 0, 0.3)';
            }
        });

        // 鼠标拖动
        backBtn.addEventListener('mousedown', function(e) {
            if (!isDraggable) return;
            isDragging = true;
            var rect = backBtn.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
            backBtn.classList.add('dragging');
            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            var x = e.clientX - dragOffsetX;
            var y = e.clientY - dragOffsetY;
            x = Math.max(0, Math.min(window.innerWidth - backBtn.offsetWidth, x));
            y = Math.max(0, Math.min(window.innerHeight - backBtn.offsetHeight, y));
            backBtn.style.left = x + 'px';
            backBtn.style.top = y + 'px';
            backBtn.style.right = 'auto';
            backBtn.style.bottom = 'auto';
        });

        document.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                backBtn.classList.remove('dragging');
            }
        });

        // 触摸拖动
        backBtn.addEventListener('touchstart', function(e) {
            if (!isDraggable) return;
            var touch = e.touches[0];
            isDragging = true;
            var rect = backBtn.getBoundingClientRect();
            dragOffsetX = touch.clientX - rect.left;
            dragOffsetY = touch.clientY - rect.top;
            backBtn.classList.add('dragging');
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            var touch = e.touches[0];
            var x = touch.clientX - dragOffsetX;
            var y = touch.clientY - dragOffsetY;
            x = Math.max(0, Math.min(window.innerWidth - backBtn.offsetWidth, x));
            y = Math.max(0, Math.min(window.innerHeight - backBtn.offsetHeight, y));
            backBtn.style.left = x + 'px';
            backBtn.style.top = y + 'px';
            backBtn.style.right = 'auto';
            backBtn.style.bottom = 'auto';
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchend', function() {
            if (isDragging) {
                isDragging = false;
                backBtn.classList.remove('dragging');
            }
        });

        // 单击返回锁屏
        backBtn.addEventListener('click', function(e) {
            if (isDragging) return;
            if (isDraggable) return; // 可拖动状态下单击不触发返回
            // 返回锁屏
            if (lockScreenEl) lockScreenEl.style.display = 'flex';
            if (welcomeEl) welcomeEl.style.display = 'none';
            if (headerEl) headerEl.style.display = 'none';
            if (chatAreaEl) chatAreaEl.style.display = 'none';
            if (inputAreaEl) inputAreaEl.style.display = 'none';
            if (immersiveBtn) immersiveBtn.style.display = 'none';
            backBtn.style.display = 'none';
            var loaderBar = document.getElementById('loader-tech-bar');
            if (loaderBar) loaderBar.style.width = '0%';
        });

        // 解锁逻辑
        if (lockUnlockBtn) {
            lockUnlockBtn.addEventListener('click', function() {
                if (lockScreenEl) lockScreenEl.style.display = 'none';
                if (welcomeEl) {
                    welcomeEl.style.display = 'flex';
                    var loaderBar = document.getElementById('loader-tech-bar');
                    if (loaderBar) {
                        loaderBar.style.width = '0%';
                        var progress = 0;
                        var interval = setInterval(function() {
                            progress += Math.random() * 15 + 5;
                            if (progress >= 100) {
                                progress = 100;
                                clearInterval(interval);
                                setTimeout(function() {
                                    if (welcomeEl) welcomeEl.style.display = 'none';
                                    if (headerEl) headerEl.style.display = 'flex';
                                    if (chatAreaEl) chatAreaEl.style.display = 'block';
                                    if (inputAreaEl) inputAreaEl.style.display = 'block';
                                    if (immersiveBtn) immersiveBtn.style.display = 'flex';
                                    backBtn.style.display = 'flex';
                                    if (typeof initApp === 'function') initApp();
                                }, 400);
                            }
                            if (loaderBar) loaderBar.style.width = progress + '%';
                        }, 80);
                    }
                }
                this.style.transform = 'scale(0.94)';
                setTimeout(function() { if (lockUnlockBtn) lockUnlockBtn.style.transform = ''; }, 150);
            });
        }

        // ============================================================
        //  锁屏：输入框空值保护
        // ============================================================
        document.querySelectorAll('#lockScreen input[spellcheck="false"]').forEach(function(input) {
            var def = input.value;
            input.setAttribute('data-default', def);
            input.addEventListener('blur', function() {
                if (this.value.trim() === '') {
                    this.value = this.getAttribute('data-default') || '未定义';
                }
            });
        });

        // ============================================================
        //  页面加载时：只显示锁屏，隐藏其他内容
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            if (lockScreenEl) lockScreenEl.style.display = 'flex';
            if (welcomeEl) welcomeEl.style.display = 'none';
            if (headerEl) headerEl.style.display = 'none';
            if (chatAreaEl) chatAreaEl.style.display = 'none';
            if (inputAreaEl) inputAreaEl.style.display = 'none';
            if (immersiveBtn) immersiveBtn.style.display = 'none';
            backBtn.style.display = 'none';
            backBtn.style.right = '20px';
            backBtn.style.bottom = '100px';
            backBtn.style.left = 'auto';
            backBtn.style.top = 'auto';
            console.log('🔒 锁屏已加载');
        });

        console.log('🔐 锁屏字卡已加载 · 点击「解锁」进入聊天');

        // ============================================================
        //  暴露返回图标控制
        // ============================================================
        window._backFloatBtn = backBtn;
        window._showBackBtn = function() { backBtn.style.display = 'flex'; };
        window._hideBackBtn = function() { backBtn.style.display = 'none'; };

    })();
</script>

</body>
</html>
